<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid/Circles Decoration -->
  <circle cx="1100" cy="100" r="300" fill="#10b981" opacity="0.08"/>
  <circle cx="150" cy="550" r="220" fill="#34d399" opacity="0.06"/>

  <!-- Main Card Container -->
  <g transform="translate(100, 85)" filter="url(#cardShadow)">
    <rect width="1000" height="460" rx="28" fill="#111827" fill-opacity="0.85" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Top Pill Badge -->
    <rect x="60" y="50" width="280" height="44" rx="22" fill="#065f46"/>
    <circle cx="82" cy="72" r="7" fill="#34d399"/>
    <text x="98" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0" letter-spacing="1">100% OFFLINE &amp; PRIVASI AMAN</text>

    <!-- Brand Header -->
    <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Kompres<tspan fill="#34d399">MiniMax</tspan>
    </text>

    <!-- Slogan / Subtitle -->
    <text x="60" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#e5e7eb">
      Kompres Dokumen PDF &amp; Foto Sesuai Target KB / MB
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(60, 260)">
      <!-- Badge 1: CPNS Target -->
      <rect x="0" y="0" width="260" height="60" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
      <text x="24" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#fbbf24">🎯 Target 200KB / 100KB</text>

      <!-- Badge 2: Resize Pas Foto -->
      <rect x="280" y="0" width="280" height="60" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
      <text x="300" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#60a5fa">📸 Pas Foto 2x3, 3x4, 4x6</text>

      <!-- Badge 3: Gabung & Scan PDF -->
      <rect x="580" y="0" width="290" height="60" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
      <text x="600" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#a7f3d0">📄 Gabung &amp; Scan PDF</text>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(60, 365)">
      <text x="0" y="30" font-family="sans-serif" font-size="20" fill="#9ca3af">
        ⚡ Instan tanpa antri • 🔒 File tidak diunggah ke server • 💯 Gratis tanpa watermark
      </text>
    </g>
  </g>
</svg>
