<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit PDF - KompresMiniMax</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
h1{color:#333;margin-bottom:20px;text-align:center}
.upload-area{border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;background:white;cursor:pointer;margin-bottom:20px}
.upload-area:hover{border-color:#007bff;background:#eef7ff}
.upload-area input[type="file"]{display:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;transition:.2s}
.btn-primary{background:#007bff;color:#fff}
.btn-secondary{background:#6c757d;color:#fff}
.btn-danger{background:#dc3545;color:#fff}
.page-container{display:flex;flex-wrap:wrap;gap:16px}
.page-item{background:#fff;border-radius:8px;width:min(220px,45vw);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.thumb-wrap{width:min(220px,45vw);height:min(280px,60vw);background:#eee;border-radius:6px;display:flex}
.thumb{width:min(220px,45vw);height:min(280px,60vw);object-fit:contain}
.pagenum{text-align:center;font-size:.9rem;margin-top:.4rem}
.actions{display:flex;margin-top:.4rem}
.actions button{flex:1;margin-right:.2rem;padding:.3rem;border:none;border-radius:4px;cursor:pointer;font-weight:600}
.del{background:#fee}
.rot{background:#eee}
.status{text-align:center;padding:.8rem;margin:10px 0;border-radius:4px;font-weight:bold}
.success{background:#d4edda;color:#155724}
.error{background:#f8d7da;color:#721c24}
.loading{text-align:center;padding:40px;color:#666}
.spinner{border:4px solid #f3f3f3;border-top:4px solid #007bff;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
<h1>✏️ Edit PDF - KompresMiniMax</h1>

<div id="uploadSection">
<div class="upload-area" onclick="document.getElementById('pdfInput').click()">
<input type="file" id="pdfInput" accept=".pdf" onchange="handleFile(this)">
<p>📤 Klik untuk pilih file PDF atau drag & drop di sini</p>
<small>Pemrosesan 100% di browser — file tidak pernah diunggah ke server.</small>
</div>
</div>

<div id="editorSection" class="hidden">
<div class="toolbar">
<button class="btn btn-primary" onclick="downloadPDF()">💾 Simpan & Unduh PDF Hasil</button>
<button class="btn btn-secondary" onclick="resetAll()">🔄 Mulai Ulang / Ganti File</button>
<span id="fileInfo" style="margin-left:auto;color:#555"></span>
</div>

<div id="statusContainer"></div>
<div class="loading hidden" id="loadingBox">
<div class="spinner"></div>
<div id="loadingText">Processing...</div>
</div>

<div class="page-container" id="pagesGrid"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let originalBytes = null;
let pageState = []; // [{rotation: number, imgData: string}]

function showStatus(msg, isError=false){
  const container = document.getElementById('statusContainer');
  container.innerHTML = `<div class="status ${isError ? 'error' : 'success'}">${msg}</div>`;
}

function showLoading(show, text=''){
  const box = document.getElementById('loadingBox');
  const txt = document.getElementById('loadingText');
  box.classList.toggle('hidden', !show);
  txt.textContent = text || 'Processing...';
}

async function handleFile(input){
  if(!input.files?.length)return;
  const file = input.files[0];
  if(!file.name.toLowerCase().endsWith('.pdf')){
    showStatus('❌ File harus dalam format PDF!', true);return;
  }
  showStatus('⏳ Memuat dokumen...');
  const reader = new FileReader();
  reader.onload = async(e)=>{
    try{
      originalBytes = new Uint8Array(e.target.result);
      const pdfDoc = await pdfjsLib.getDocument({data: originalBytes}).promise;
      
      pageState = [];
      showLoading(true, `Rendering ${pdfDoc.numPages} halaman...`);
      
      for(let i=1;i<=pdfDoc.numPages;i++){
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({scale: 0.7});
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        
        await page.render({canvasContext: context, viewport}).promise;
        
        pageState.push({
          pageNumber: i,
          rotation: 0,
          imgData: canvas.toDataURL('image/jpeg', 0.8)
        });
      }
      
      document.getElementById('uploadSection').classList.add('hidden');
      document.getElementById('editorSection').classList.remove('hidden');
      document.getElementById('fileInfo').textContent = `📄 ${file.name} (${pageState.length} halaman)`;
      
      renderGrid();
      showStatus(`✅ Berhasil memuat ${pageState.length} halaman!`, false);
    }catch(err){
      console.error(err);
      showStatus('❌ Error: '+err.message, true);
    }finally{
      showLoading(false);
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderGrid(){
  const grid = document.getElementById('pagesGrid');
  grid.innerHTML = '';
  
  pageState.forEach((state,index)=>{
    const item = document.createElement('div');
    item.className = 'page-item';
    
    const thumbDiv = document.createElement('div');
    thumbDiv.className = 'thumb-wrap';
    
    const img = document.createElement('img');
    img.src = state.imgData;
    img.className = 'thumb';
    img.style.transform = getRotationStyle(state.rotation);
    
    thumbDiv.appendChild(img);
    
    const pageNum = document.createElement('div');
    pageNum.className = 'pagenum';
    pageNum.textContent = `Halaman ${index+1}`;
    
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'actions';
    
    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '🗑 Hapus';
    delBtn.onclick = ()=>deletePage(index);
    
    const rotLBtn = document.createElement('button');
    rotLBtn.className = 'rot';
    rotLBtn.textContent = '↺ Kiri';
    rotLBtn.onclick = ()=>rotatePage(index, -90);
    
    const rotRBtn = document.createElement('button');
    rotRBtn.className = 'rot';
    rotRBtn.textContent = 'Kanan ↻';
    rotRBtn.onclick = ()=>rotatePage(index, 90);
    
    actionsDiv.append(delBtn, rotLBtn, rotRBtn);
    item.append(thumbDiv, pageNum, actionsDiv);
    grid.appendChild(item);
  });
}

function getRotationStyle(deg){
  while(deg<0)deg+=360;
  deg%=360;
  return deg===90?'rotate(90deg)':deg===180?'rotate(180deg)':deg===270||deg===-90?'rotate(-90deg)':'none';
}

function rotatePage(index,delta){
  pageState[index].rotation = (pageState[index].rotation+delta)%360;
  while(pageState[index].rotation<0)pageState[index].rotation+=360;
  renderGrid();
  showStatus(`✅ Rotasi diterapkan pada halaman ${index+1}`);
}

function deletePage(index){
  if(confirm(`Hapus halaman ${index+1}?`)){
    pageState.splice(index,1);
    renderGrid();
    showStatus('🗑 Halaman berhasil dihapus');
  }
}

function resetAll(){
  location.reload();
}

async function downloadPDF(){
  if(pageState.length===0){
    showStatus('❌ Tidak ada halaman untuk disimpan!', true);return;
  }
  
  showLoading(true, 'Membuat PDF hasil editan...');
  
  try{
    const {PDFDocument} = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
    const pdfDoc = await PDFDocument.create();
    
    for(const state of pageState){
      const dataUrl = state.imgData;
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const arr = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)arr[i]=binary.charCodeAt(i);
      
      const image = await pdfDoc.embedJpg(arr);
      let width=image.width,height=image.height;
      
      if(state.rotation===90||state.rotation===270){
        [width,height]=[height,width];
      }
      
      const page = pdfDoc.addPage([width,height]);
      const {Width,height:H} = page.getDimensions();
      
      page.drawImage(image,{
        x: state.rotation===0? Width-image.width : 
           state.rotation===90? Width-H:image.rotation===180?Width-image.width:Width-image.height,
        y: state.rotation===0? H-image.height :
           state.rotation===90? H-width:state.rotation===180?H-image.height:H-image.height,
        width: state.rotation===90||state.rotation===270? image.height:image.width,
        height: state.rotation===90||state.rotation===270? image.width:image.height,
      });
    }
    
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes],{type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'edited-document.pdf';
    link.click();
    URL.revokeObjectURL(url);
    
    showStatus('✅ PDF berhasil diunduh!', false);
  }catch(err){
    console.error(err);
    showStatus('❌ Error saat membuat PDF: '+err.message, true);
  }finally{
    showLoading(false);
  }
}
</script>
</body>
</html>
