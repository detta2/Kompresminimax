<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="34" height="34" class="brand-logo-icon">
  <!-- Soft Glow / Shadow -->
  <ellipse cx="32" cy="59" rx="22" ry="3.5" fill="rgba(0,0,0,0.12)"/>
  
  <!-- Dino Tail -->
  <path d="M18 45 C12 46 6 42 4 36 C8 37 13 41 18 43 Z" fill="#10B981"/>
  <path d="M12 44 C8 44 5 40 4 36 C6 38 10 41 12 44 Z" fill="#059669"/>

  <!-- Back Spikes (Lucu/Cute Plates) -->
  <polygon points="17,25 12,23 15,29" fill="#F59E0B"/>
  <polygon points="15,31 9,31 13,36" fill="#F59E0B"/>
  <polygon points="14,38 8,40 13,43" fill="#F59E0B"/>

  <!-- Dino Body -->
  <path d="M18 28 C18 20 26 14 36 14 C44 14 49 19 49 27 C49 33 46 36 43 38 C43 43 43 51 41 54 C39 57 33 57 26 57 C20 57 18 52 18 45 Z" fill="#10B981"/>
  <!-- Dino Belly -->
  <path d="M28 32 C33 32 38 36 38 45 C38 52 35 56 30 56 C25 56 24 51 24 45 C24 37 25 32 28 32 Z" fill="#A7F3D0"/>

  <!-- Feet -->
  <ellipse cx="25" cy="56" rx="5" ry="3" fill="#059669"/>
  <circle cx="23" cy="57" r="1.2" fill="#FFFFFF"/>
  <circle cx="26" cy="57" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="37" cy="56" rx="5" ry="3" fill="#059669"/>
  <circle cx="35" cy="57" r="1.2" fill="#FFFFFF"/>
  <circle cx="38" cy="57" r="1.2" fill="#FFFFFF"/>

  <!-- Cute Big Eye & Sparkles -->
  <ellipse cx="39" cy="23" rx="4.8" ry="5.5" fill="#1F2937"/>
  <circle cx="40.5" cy="21.5" r="2" fill="#FFFFFF"/>
  <circle cx="37.8" cy="24.8" r="1" fill="#FFFFFF"/>

  <!-- Rosy Blush Cheek -->
  <ellipse cx="44" cy="29" rx="3" ry="1.8" fill="#F472B6" opacity="0.85"/>
  <!-- Happy Smile / Little Snout -->
  <path d="M44 26 C47 26 49 28 47 30" stroke="#047857" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Tumpukan Buku WinRAR style di dekap oleh tangan dino -->
  <!-- Buku 1 (Bawah - Merah WinRAR) -->
  <rect x="29" y="47" width="26" height="6.5" rx="2" fill="#EF4444"/>
  <rect x="31" y="48.5" width="22" height="1.8" fill="#FCA5A5" opacity="0.8"/>
  <rect x="52" y="48" width="2.5" height="4.5" rx="1" fill="#FEF08A"/>
  
  <!-- Buku 2 (Tengah - Biru WinRAR) -->
  <rect x="31" y="40.5" width="25" height="6.5" rx="2" fill="#3B82F6"/>
  <rect x="33" y="42" width="21" height="1.8" fill="#93C5FD" opacity="0.8"/>
  <rect x="53" y="41.5" width="2.5" height="4.5" rx="1" fill="#FEF08A"/>

  <!-- Buku 3 (Atas - Hijau WinRAR) -->
  <rect x="30" y="34" width="24" height="6.5" rx="2" fill="#10B981"/>
  <rect x="32" y="35.5" width="20" height="1.8" fill="#6EE7B7" opacity="0.8"/>
  <rect x="51" y="35" width="2.5" height="4.5" rx="1" fill="#FEF08A"/>

  <!-- Sabuk Pengikat Buku WinRAR (Belt buckle) -->
  <rect x="42" y="33" width="3.5" height="21" rx="1" fill="#4B5563"/>
  <rect x="41.5" y="42" width="4.5" height="4.5" rx="1" fill="#F59E0B" stroke="#B45309" stroke-width="0.7"/>

  <!-- Cute Dino Little Arms Peluk Buku -->
  <path d="M26 38 C28 35 34 38 34 42 C34 44 31 45 28 43 Z" fill="#10B981"/>
  <circle cx="34" cy="42" r="2" fill="#059669"/>
</svg>